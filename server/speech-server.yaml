# macos-tts-server configuration: TTS-only, installed Siri voice assets.
log_level: notice

servers:
  http:
    host: 0.0.0.0     # ordinary service; reachable over whatever network you have
    port: 8787        # 8080 is taken by whisper-server on this Mac
  wyoming:
    port: 0           # Wyoming (Home Assistant) protocol disabled

stt:
  engine: none        # fork addition: TTS-only server, no ASR model downloads

tts:
  engine: siri        # private on-device Siri natural/neural voices
  siri:
    # default_voice: com.apple.siri.tts.voice.en_US.nora.natural.premium
    max_loaded_voices: 4       # resident engines are never torn down
    max_concurrent_syntheses: 4
    max_queued_requests: 20
